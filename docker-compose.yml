version: '3.8'

services:
  # Development service
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: inbox-detection-ui-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev

  # Production service
  prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: inbox-detection-ui-prod
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
